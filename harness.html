<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>bnote editor harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; }
      #editor-host { height: 100vh; }
    </style>
    <script>
      // Boot-time error capture: when the harness module graph fails to evaluate the
      // page just goes blank, so this is the only place the errors can be caught.
      window.__bootErrors = [];
      window.addEventListener("error", (e) =>
        window.__bootErrors.push(String((e.error && e.error.stack) || e.message)),
      );
      window.addEventListener("unhandledrejection", (e) =>
        window.__bootErrors.push(String((e.reason && e.reason.stack) || e.reason)),
      );
    </script>
  </head>
  <body>
    <div id="editor-host"></div>
    <script type="module" src="/src/dev/harness.ts"></script>
  </body>
</html>
