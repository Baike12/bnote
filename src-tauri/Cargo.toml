[package]
name = "bnote"
version = "0.1.0"
description = "A fast Obsidian-like markdown notebook built with Tauri"
authors = ["baike3"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: 提供多 webview(Window::add_child)API,学习模式的中栏网页预览
# 就是主窗口的一个子 webview(src/commands/agent.rs::show_study_preview)。
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
trash = "5"
base64 = "0.22"
core-foundation = "0.10"
pdf2md = { path = "crates/pdf2md" }
# 内置英汉词典(学习模式选中翻译):压缩数据在编译期进二进制,运行时一次性
# 解压到内存,不落盘、不依赖外部资源文件。数据由 scripts/build-dict.py 生成。
zstd = "0.13"

# study-mode agent
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
futures = "0.3"
scraper = "0.20"
# 中文材料目录名(转拼音,词级多音字):pinyin-pro 的 Rust 移植。
pinyin_pro = "3.29.4"
ego-tree = "0.6"

# 学习模式网页的笔形光标(commands/pen_cursor.rs):浏览器里 CSS 图片光标在
# WKWebView 下每次鼠标移动都会被重建重设,只能由原生层给同一支 NSCursor。
# 版本与 tauri 自身的依赖一致,不新增第二份 objc2。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSCursor",
  "NSEvent",
  "NSImage",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSString",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
