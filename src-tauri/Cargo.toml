[package]
name = "bnote"
version = "0.1.0"
description = "A fast Obsidian-like markdown notebook built with Tauri"
authors = ["baike3"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: 提供多 webview(Window::add_child)API,学习模式的中栏网页预览
# 就是主窗口的一个子 webview(study preview 命令)。
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde.workspace = true
serde_json.workspace = true

# All backend logic (vault/files/config/ime/python/agent) lives in bnote-core;
# this shell only owns the WebView, the menu, and the study-preview webviews.
bnote-core = { path = "../crates/bnote-core" }
# Core's event bus is a tokio broadcast channel; the forwarder awaits it on
# Tauri's own async runtime.
tokio = { version = "1", default-features = false, features = ["sync"] }
